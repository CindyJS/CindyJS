name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build and test
        run: node make build=release alltests

  katex:
    # Pixel comparison of the KaTeX plugin (tests/katex-canvas): KaTeX's
    # HTML output vs the canvas backend, the plugin in CindyJS, and the
    # examples with the old vs the new plugin.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # CindyGL, needed by one of the examples, is built with Closure.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: node make Cindy.js katex cindygl sass

      - name: Test
        run: npm run test:katex-canvas

      - name: Upload galleries
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: katex-canvas
          path: build/katex-canvas/

  deploy:
    needs: test
    runs-on: ubuntu-22.04
    environment: deploy
    if: >
      github.repository == 'CindyJS/CindyJS' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Build release
        run: node make build=release alltests

      - name: Deploy
        run: tools/deploy.sh
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GIT_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
