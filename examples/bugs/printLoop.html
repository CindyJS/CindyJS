<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    
    <title>Modifier Evaluation Context</title>
    <style type="text/css">
        * {
            margin: 0px;
            padding: 0px;
        }
        
        #CSConsole {
            background-color: #FAFAFA;
            border-top: 1px solid #333333;
            bottom: 0px;
            height: 200px;
            overflow-y: scroll;
            position: fixed;
            width: 100%;
        }
    </style>
        <script type="text/javascript" src="../../build/js/Cindy.js"></script>
        <link rel="stylesheet" href="../../css/cindy.css" />
        
<script id="csinit" type="text/x-cindyscript">
  A = {"c":[],"p":[]};
  B = {"c":[],"p":[]};
  C = {"c":[],"p":[A,B]};
  A:"c" = append(A:"c",C);
  B:"c" = append(B:"c",C);
  print(A);
</script>
<script id="csdraw" type="text/x-cindyscript">
//Script (CindyScript)
drawtext((-8,6),"This page should not lag your browser",size->25);
drawtext((-8,0),A,size->25);
;

</script>
    <script type="text/javascript">
var cdy = CindyJS({
  scripts: "cs*",
  defaultAppearance: {
    dimDependent: 0.7,
    fontFamily: "sans-serif",
    lineSize: 1,
    pointSize: 5.0,
    textsize: 12.0
  },
  angleUnit: "°",
  ports: [{
    width: 680,
    height: 333,
    id: "CSCanvas",
    transform: [{visibleRect: [-9.06, 9.34, 18.14, -3.98]}],
    background: "rgb(168,176,192)"
  }],
  csconsole: false,
  cinderella: {build: 2088, version: [3, 0, 2088]}
});
    </script>
</head>
<body>
    <div id="CSCanvas"></div>
</body>
</html>
